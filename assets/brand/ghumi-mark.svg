<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- horizon fill: lower segment of the ring -->
  <path d="M13.9 57 A38 38 0 0 0 86.1 57 Z" fill="#0E7C6B" opacity="0.13"/>
  <!-- horizon line -->
  <line x1="14.5" y1="57" x2="85.5" y2="57" stroke="#0E7C6B" stroke-width="5" stroke-linecap="round"/>
  <!-- ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#0E7C6B" stroke-width="6.5"/>
  <!-- needle, symmetric about the hub, bearing NE -->
  <g transform="rotate(40 50 50)">
    <path d="M50 24 L58.5 50 L50 76 L41.5 50 Z" fill="#D2694A"/>
  </g>
  <circle cx="50" cy="50" r="4.2" fill="#FBF7F1"/>
</svg>
